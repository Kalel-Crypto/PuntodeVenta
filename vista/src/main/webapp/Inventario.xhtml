<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Inventario</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .busqueda {
            flex-grow: 1;
            text-align: center;
        }

        .btn-blue {
            background: #3b82f6 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-red {
            background: #f87171 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-green {
            background: #4ade80 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .header-azul {
            background: #3b82f6;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</h:head>

<h:body>

    <div class="contenedor">

        <h:form id="formInventario">

            <p:growl id="growl" showDetail="true" life="3000"/>

            <p:tabView id="tabsPrincipal">

                <p:tab title="Inventario">

                    <div class="barra-superior">

                        <p:commandButton value="Regresar"
                                         styleClass="btn-blue"
                                         action="#"/>

                        <div class="busqueda">

                            <p:inputText id="busqueda"
                                         value="#{InventarioBean.busqueda}"
                                         placeholder="ingrese su nombre o ID..." />

                            <p:commandButton value="Buscar"
                                             action="#{InventarioBean.buscarProducto}"
                                             process="@this busqueda"
                                             update="tablaInventario"
                                             styleClass="btn-green"/>

                            <p:commandButton value="Refrescar"
                                             action="#{InventarioBean.refrescar()}"
                                             process="@this"
                                             update="tablaInventario"/>

                        </div>
                    </div>

                    <p:dataTable id="tablaInventario"
                                 value="#{InventarioBean.listaInventario}"
                                 var="producto"
                                 selection="#{InventarioBean.seleccionado}"
                                 selectionMode="single"
                                 rowKey="#{producto.idProducto}">

                        <p:ajax event="rowSelect" update="formInventario"/>
                        <p:ajax event="rowUnselect" update="formInventario"/>

                        <p:column headerText="ID">#{producto.idProducto}</p:column>
                        <p:column headerText="Nombre">#{producto.nombreProducto}</p:column>

                        <p:column headerText="Stock">
                            <h:outputText value="#{producto.stock} unidades"/>
                        </p:column>

                        <p:column headerText="Precio">
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>



                        <p:column headerText="Total Valor">
                            <h:outputText value="#{producto.stock * producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Proveedor">#{producto.proveedor}</p:column>

                    </p:dataTable>

                    <div style="text-align:center; margin-top:15px;">

                        <p:commandButton value="Eliminar"
                                         action="#{InventarioBean.prepararEliminar}"
                                         process="@this"
                                         update="formInventario growl"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-red"/>

                        <p:commandButton value="Modificar"
                                         action="#{InventarioBean.prepararModificar}"
                                         process="@this"
                                         update="formInventario growl"
                                         oncomplete="PF('dlgModificar').show()"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-green"/>

                    </div>

                    <p:dialog header="Modificar Producto"
                              widgetVar="dlgModificar"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="formModificar">

                            <p:panelGrid columns="2"
                                         rendered="#{not empty InventarioBean.productoEdit}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre del Producto:" />
                                <p:inputText value="#{InventarioBean.productoEdit.nombreProducto}" required="true" requiredMessage="No deje el campo del nombre vacio" />

                                <p:outputLabel value="Precio:" />
                                <p:inputText value="#{InventarioBean.productoEdit.precio}" required="true"  requiredMessage="No deje el campo del precio vacio"/>

                                <p:outputLabel value="Stock:" />
                                <p:inputText value="#{InventarioBean.productoEdit.stock}" required="true" requiredMessage="No deje el Stock vacio"/>

                                <p:outputLabel value="ID Proveedor:" />
                                <p:inputText value="#{InventarioBean.productoEdit.idProveedor}" required="true" requiredMessage="Seleccione un proveedor"/>

                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{InventarioBean.modificarProducto}"
                                                 process="formModificar"
                                                 update=":formInventario:tabsPrincipal:tablaInventario :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModificar').hide()"
                                                 styleClass="btn-blue" />
                            </div>

                        </p:outputPanel>
                    </p:dialog>
                </p:tab>

                <p:tab title="Movimientos">
                    <div class="header-azul">Gestión de Carga y Descarga de Stock</div>

                    <p:dataTable id="tablaMovimientos"
                                 value="#{InventarioBean.listaInventario}"
                                 var="p" rows="10" paginator="true" paginatorPosition="bottom">

                        <p:column headerText="Producto">#{p.nombreProducto}</p:column>

                        <p:column headerText="Stock Actual" style="text-align:center;">
                            <h:outputText value="#{p.stock}" style="font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Cantidad">
                            <p:spinner id="cantOp" value="#{InventarioBean.cantidadOperacion}" min="1" style="width:100%"/>
                        </p:column>

                        <p:column headerText="Acciones" style="text-align:center;">
                            <p:commandButton value="Entrada" icon="pi pi-plus"
                                             action="#{InventarioBean.registrarEntrada(p)}"
                                             process="@this cantOp"
                                             update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario"
                                             styleClass="btn-green" style="margin-right:5px;"/>

                            <p:commandButton value="Salida" icon="pi pi-minus"
                                             action="#{InventarioBean.registrarSalida(p)}"
                                             process="@this cantOp"
                                             update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario"
                                             styleClass="btn-red"/>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="Altas">

                    <p:tabView>

                        <p:tab title="Registrar Producto">

                            <p:growl id="msgs" showDetail="true"/>

                            <div class="header-azul">Registro de productos</div>

                            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder panel-contenedor">

                                <p:outputLabel for="nombre" value="Nombre *"/>
                                <p:inputText id="nombre" value="#{productoBean.producto.nombre}" required="true" requiredMessage="Asegurese de ingresar un nombre"/>

                                <p:outputLabel for="precio" value="Precio *"/>
                                <p:inputText id="precio" value="#{productoBean.producto.precio}" required="true" requiredMessage="Asegurese de ingresar un precio"/>

                                <p:outputLabel for="proveedor" value="Proveedor *"/>
                                <p:selectOneMenu id="proveedor" value="#{productoBean.idProveedorSeleccionado}" required="true" requiredMessage="Seleccione un proveedor">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov"
                                                   itemLabel="#{prov.nombre}" itemValue="#{prov.id}"/>
                                </p:selectOneMenu>

                                <p:outputLabel for="stock" value="Stock *"/>
                                <p:inputText id="stock" value="#{productoBean.stockInicial}" required="true" requiredMessage="No deje el Stock vacio"/>

                                <h:panelGrid columns="2" style="margin-top:20px;">
                                    <p:commandButton value="Cancelar" process="@this"/>

                                    <p:commandButton value="Registrar"
                                                     action="#{productoBean.registrar}"
                                                     process="@this nombre precio proveedor stock"
                                                     update="msgs"
                                                     styleClass="btn-green"/>
                                </h:panelGrid>

                            </p:panelGrid>

                        </p:tab>

                        <p:tab title="Registrar Proveedor">

                            <p:growl id="msgsProveedor"/>

                            <p:panelGrid columns="1">

                                <p:outputLabel value="Nombre del proveedor *"/>
                                <p:inputText id="nombreProv" value="#{proveedorBean.proveedor.nombre}" required="true" requiredMessage="Asegurese de ingresar un nombre"/>
                                <p:outputLabel value="Numero del proveedor *"/>
                                <p:inputText id="telefonoProv" value="#{proveedorBean.proveedor.contacto}" required="true" requiredMessage="Asegurese de ingresar un numero de celular"/>

                                <p:commandButton value="Registrar"
                                                 action="#{proveedorBean.registrar}"
                                                 process="@this nombreProv telefonoProv"
                                                 update="msgsProveedor"/>

                            </p:panelGrid>

                        </p:tab>

                        <p:tab title="Registrar Usuario">

                            <p:growl id="msgsUsuario"/>

                            <p:panelGrid columns="1">

                                <p:outputLabel value="Nombre de usuario *"/>
                                <p:inputText id="nombreUsuario" value="#{usuarioBean.usuario.nombre}" required="true" requiredMessage="Asegurese de ingresar un nombre"/>
                                <p:outputLabel value="Constraseña *"/>
                                <p:password id="passwordUsuario" value="#{usuarioBean.usuario.password}" required="true" requiredMessage="Asegurese de ingresar una contraseña"/>

                                <p:selectOneMenu id="rolUsuario" value="#{usuarioBean.usuario.rol}" required="true" requiredMessage="Seleccione un rol">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{usuarioBean.roles}" var="rol"
                                                   itemLabel="#{rol}" itemValue="#{rol}"/>
                                </p:selectOneMenu>

                                <p:commandButton value="Registrar"
                                                 action="#{usuarioBean.registrar}"
                                                 process="@this nombreUsuario passwordUsuario rolUsuario"
                                                 update="msgsUsuario"/>

                            </p:panelGrid>

                        </p:tab>

                    </p:tabView>

                </p:tab>

                <p:tab title="Proveedores">

                    <div class="controls-container barra-superior">
                        <p:commandButton value="Regresar" action="inventario.xhtml" styleClass="btn-blue" />

                        <div class="busqueda">
                            <p:inputText id="busquedaProveedor"
                                         value="#{proveedorBean.busqueda}"
                                         placeholder="ingrese nombre o ID..." />

                            <p:commandButton value="Buscar"
                                             action="#{proveedorBean.buscarProveedor}"
                                             process="@this busquedaProveedor"
                                             update="tablaProveedores"
                                             styleClass="btn-green" />

                            <p:commandButton value="Refrescar"
                                             actionListener="#{proveedorBean.cargarProveedores}"
                                             update="tablaProveedores"
                                             styleClass="btn-blue" />
                        </div>
                    </div>

                    <p:dataTable id="tablaProveedores"
                                 value="#{proveedorBean.listaProveedores}"
                                 var="prov"
                                 emptyMessage="No se encontraron proveedores"
                                 style="margin-top:20px;">

                        <p:column headerText="ID Proveedor">
                            <h:outputText value="#{prov.id}" />
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{prov.nombre}" />
                        </p:column>

                        <p:column headerText="Contacto">
                            <h:outputText value="#{prov.contacto}" />
                        </p:column>

                        <p:column headerText="Acciones" style="text-align: center;">

                            <p:commandButton value="Modificar"
                                             action="#{proveedorBean.prepararModificacion(prov)}"
                                             process="@this"  update=":formInventario:tabsPrincipal:panelModificarProv"
                                             oncomplete="PF('dlgModProv').show()"
                                             styleClass="btn-green"
                                             style="margin-right: 5px;" />

                            <p:commandButton value="Eliminar"
                                             actionListener="#{proveedorBean.eliminarProveedor(prov)}"
                                             update="tablaProveedores growl"
                                             styleClass="btn-red">
                                <p:confirm header="Confirmación"
                                           message="¿Estás seguro de que deseas eliminar permanentemente a este proveedor?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>

                        </p:column>
                    </p:dataTable>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                                     responsive="true" width="350">
                        <p:commandButton value="No" type="button"
                                         styleClass="ui-confirmdialog-no ui-button-flat"/>
                        <p:commandButton value="Sí" type="button"
                                         styleClass="ui-confirmdialog-yes" />
                    </p:confirmDialog>

                    <p:dialog header="Modificar Proveedor"
                              widgetVar="dlgModProv"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="panelModificarProv">

                            <p:panelGrid columns="2"
                                         rendered="#{not empty proveedorBean.proveedorSeleccionado}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre:" />
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.nombre}" required="true" requiredMessage="No deje el campo de nombre vacio"/>

                                <p:outputLabel value="Contacto:" />
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.contacto}" required="true" requiredMessage="No deje el campo del numero telefonico vacio"/>

                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{proveedorBean.guardarModificacion}"
                                                 process="panelModificarProv"
                                                 update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModProv').hide()"
                                                 styleClass="btn-blue" />
                            </div>

                        </p:outputPanel>
                    </p:dialog>

                </p:tab>

                <p:tab title="Auditoría" rendered="#{AuditoriaBean.puedeVerAuditoria()}">

                    <h:form id="formAuditoria">

                        <div class="header-azul" style="background: #3b82f6; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px;">
                            Historial de Movimientos y Reporte Mensual
                        </div>

                        <h:panelGrid columns="4" id="panelTotales" style="margin-bottom:15px; background:#f8fafc; padding:15px; border: 1px solid #e2e8f0; border-radius:8px; width:100%;">
                            <h:panelGroup>
                                <h:outputText value="TOTAL ENTRADAS: " style="font-weight:bold; color:#64748b;"/>
                                <h:outputText value="#{AuditoriaBean.totalEntradas} unidades" style="color:#22c55e; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <h:outputText value="TOTAL SALIDAS: " style="font-weight:bold; color:#64748b; margin-left:20px;"/>
                                <h:outputText value="#{AuditoriaBean.totalSalidas} unidades" style="color:#ef4444; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>

                            <p:commandButton value="Actualizar Reporte"
                                             action="#{AuditoriaBean.cargarTodosLosMovimientos}"
                                             update="@form"
                                             process="@this"
                                             icon="pi pi-refresh"
                                             styleClass="btn-blue" />
                        </h:panelGrid>

                        <p:dataTable id="tablaAuditoria"
                                     value="#{AuditoriaBean.listaMovimientos}"
                                     var="mov"
                                     emptyMessage="No hay movimientos registrados"
                                     rows="10"
                                     paginator="true"
                                     paginatorPosition="bottom"
                                     style="margin-top:10px;">

                            <p:column headerText="Fecha" style="width:150px; text-align:center;">
                                <h:outputText value="#{mov.fecha}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Usuario">
                                <i class="pi pi-user" style="margin-right:5px; color:#94a3b8;"></i>
                                <h:outputText value="#{mov.usuario.nombre}" />
                            </p:column>

                            <p:column headerText="Producto">
                                <h:outputText value="#{mov.producto.nombre}" style="font-weight:bold;" />
                            </p:column>

                            <p:column headerText="Tipo" style="text-align:center;">
                                <h:outputText value="#{mov.tipo}"
                                              style="padding:4px 8px; border-radius:4px; font-weight:bold;
                     background: #{mov.tipo == 'Entrada' ? '#dcfce7' : '#fee2e2'};
                     color: #{mov.tipo == 'Entrada' ? '#166534' : '#991b1b'}" />
                            </p:column>

                            <p:column headerText="Cantidad" style="text-align:right; width:100px;">
                                <h:outputText value="#{mov.cantidad}"
                                              style="font-weight:bold; #{mov.tipo == 'Salida' ? 'color:#ef4444;' : 'color:#22c55e;'}" />
                            </p:column>
                        </p:dataTable>

                    </h:form> </p:tab>
            </p:tabView>
        </h:form>

    </div>

</h:body>
</html>
