<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Inventario</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .busqueda {
            flex-grow: 1;
            text-align: center;
        }

        .btn-blue {
            background: #3b82f6 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-red {
            background: #f87171 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-green {
            background: #4ade80 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }
    </style>
</h:head>

<h:body>

    <div class="contenedor">

        <h:form id="formInventario">

            <p:growl id="growl" showDetail="true" life="3000"/>

            <p:tabView>

                <!-- La tabla inventario  -->
                <p:tab title="Inventario">

                    <div class="barra-superior">

                        <p:commandButton value="Regresar"
                                         styleClass="btn-blue"
                                         action="#"/>

                        <div class="busqueda">

                            <p:inputText id="busqueda"
                                         value="#{InventarioBean.busqueda}"
                                         placeholder="ingrese su nombre o ID..." />

                            <p:commandButton value="Buscar"
                                             action="#{InventarioBean.buscarProducto}"
                                             process="@this busqueda"
                                             update="tablaInventario"
                                             styleClass="btn-green"/>

                            <p:commandButton value="Refrescar"
                                             id="Refrescar"
                                             action="#{InventarioBean.refrescar()}"
                                             process="@this"
                                             update="tablaInventario"
                                             var="producto"/>


                        </div>
                    </div>

                    <p:dataTable id="tablaInventario"
                                 value="#{InventarioBean.listaInventario}"
                                 var="producto"
                                 selection="#{InventarioBean.seleccionado}"
                                 selectionMode="single"
                                 rowKey="#{producto.idProducto}">

                        <p:ajax event="rowSelect" update="formInventario"/>
                        <p:ajax event="rowUnselect" update="formInventario"/>

                        <p:column headerText="ID">#{producto.idProducto}</p:column>
                        <p:column headerText="Nombre">#{producto.nombreProducto}</p:column>
                        <p:column headerText="Stock">
                            <h:outputText value="#{producto.stock} unidades"></h:outputText>
                        </p:column>
                        <p:column headerText="Precio">
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber type="currency" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Proveedor">#{producto.proveedor}</p:column>

                    </p:dataTable>

                    <div style="text-align:center; margin-top:15px;">

                        <p:commandButton value="Eliminar"
                                         action="#{InventarioBean.prepararEliminar}"
                                         process="@this"
                                         update="formInventario growl"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-red"/>

                        <p:commandButton value="Modificar"
                                         action="#{InventarioBean.prepararModificar}"
                                         process="@this"
                                         update="formInventario growl"
                                         oncomplete="PF('dlgModificar').show()"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-green"/>

                    </div>

                </p:tab>

                <!-- Alta de producto -->
                <p:tab title="Altas">
                    <p:tabView>

                        <p:tab title="Registrar Producto">

                            <p:growl id="msgs" showDetail="true" />

                            <div class="header-azul">Registro de productos</div>

                            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder panel-contenedor">

                                <p:outputLabel for="nombre" value="Nombre *"/>
                                <p:inputText id="nombre" value="#{productoBean.producto.nombre}" required="true" requiredMessage="Ingrese un nombre"/>

                                <p:outputLabel for="precio" value="Precio *"/>
                                <p:inputText id="precio" value="#{productoBean.producto.precio}" required="true" requiredMessage="Ingrese un precio"/>

                                <p:outputLabel for="proveedor" value="Proveedor *"/>
                                <p:selectOneMenu id="proveedor" value="#{productoBean.idProveedorSeleccionado}" required="true" requiredMessage="Seleccione un proveedor" style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccione" itemValue="" noSelectionOption="true" />
                                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov"
                                                   itemLabel="#{prov.nombre}" itemValue="#{prov.id}" />
                                </p:selectOneMenu>

                                <p:outputLabel for="stock" value="Stock *"/>
                                <p:inputText id="stock" value="#{productoBean.stockInicial}" required="true" requiredMessage="Ingrese un precio"/>

                                <h:panelGrid columns="2" style="width: 100%; margin-top: 20px;">
                                    <p:commandButton value="Cancelar" process="@this" />

                                    <p:commandButton value="Registrar"
                                                     action="#{productoBean.registrar}"
                                                     process="@form"
                                                     update="msgs"
                                                     styleClass="btn-green" />
                                </h:panelGrid>

                            </p:panelGrid>

                        </p:tab>

                        <!-- Alta de proveedor -->
                        <p:tab title="Registrar Proveedor">

                            <p:growl id="msgsProveedor" showDetail="true" />

                            <div class="header-azul">Registro de proveedores</div>

                            <!--   <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder panel-contenedor">

                              <p:outputLabel for="nombreProv" value="Nombre *"/>
                                  <p:inputText id="nombreProv" value="#{proveedorBean.proveedor.nombre}" required="true"/>

                                  <p:outputLabel for="telefonoProv" value="Teléfono *"/>
                                  <p:inputText id="telefonoProv" value="#{proveedorBean.proveedor.telefono}" required="true"/>


                                  <h:panelGrid columns="2" style="width: 100%; margin-top: 20px;">

                                      <p:commandButton value="Registrar"
                                                       action="#{proveedorBean.registrar}"
                                                       process="@form"
                                                       update="formInventario msgsProveedor"
                                                       styleClass="btn-green" /> -
                                  </h:panelGrid>

                              </p:panelGrid> -->

                        </p:tab>

                    </p:tabView>
                </p:tab>
            </p:tabView>

        </h:form>

        <p:dialog header="Modificar Producto" widgetVar="dlgModificar" modal="true" width="400" appendTo="@(body)">
            <h:form id="formModificar">
                <p:messages id="mensajesDialogo" showDetail="true" closable="true" />



                <h:panelGrid columns="2">
                    <h:outputLabel value="Nombre:" />
                    <p:inputText value="#{InventarioBean.productoEdit.nombreProducto}" readonly="true" />

                    <h:outputLabel value="Stock:" />
                    <p:inputText value="#{InventarioBean.productoEdit.stock}" />

                    <h:outputLabel value="Precio:" />
                    <p:inputText value="#{InventarioBean.productoEdit.precio}" readonly="true" />

                    <h:outputLabel value="Proveedor:" />
                    <p:inputText value="#{InventarioBean.seleccionado.proveedor}" readonly="true" />
                </h:panelGrid>

                <br/>

                <p:commandButton value="Guardar Cambios"
                                 action="#{InventarioBean.modificarProducto}"
                                 process="@form"
                                 update="@form :formInventario:tablaInventario :formInventario:growl"
                                 oncomplete="if (!args.validationFailed) PF('dlgModificar').hide();" />
            </h:form>
        </p:dialog>

        <p:confirmDialog widgetVar="confirmDialog" appendTo="@(body)"> <h:outputText value="Quieres eliminar este producto?" />
            <br/><br/>

            <h:form>
                <p:commandButton value="Sí"
                                 action="#{InventarioBean.eliminarProducto}"
                                 process="@this"
                                 update=":formInventario:tablaInventario :formInventario:growl"
                                 oncomplete="PF('confirmDialog').hide()"/>

                <p:commandButton value="No"
                                 onclick="PF('confirmDialog').hide(); return false;"/>
            </h:form>
        </p:confirmDialog>

    </div> </h:body>
</html>
