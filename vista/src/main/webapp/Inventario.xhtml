<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Inventario</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef4fb;
        }


        .contenedor {
            width: 90%;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }


        .barra-superior {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .busqueda {
            flex-grow: 1;
            text-align: center;
        }

        .btn-blue {
            background: #2563eb !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            border: none !important;
            padding: 8px 15px;
            transition: 0.3s;
        }

        .btn-blue:hover {
            background: #1e40af !important;
        }

        .btn-green {
            background: #3b82f6 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            border: none !important;
            padding: 8px 15px;
            transition: 0.3s;
        }

        .btn-green:hover {
            background: #1d4ed8 !important;
        }

        .btn-red {
            background: #ef4444 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            border: none !important;
            padding: 8px 15px;
            transition: 0.3s;
        }

        .btn-red:hover {
            background: #b91c1c !important;
        }


        .header-azul {
            background: linear-gradient(90deg, #2563eb, #1e3a8a);
            color: white;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }


        .ui-inputfield {
            border-radius: 6px !important;
            border: 1px solid #cbd5f5 !important;
        }


        .ui-datatable {
            border-radius: 10px;
            overflow: hidden;
        }

        .ui-datatable thead th {
            background: #1e3a8a !important;
            color: white !important;
            border: none !important;
        }

        .ui-datatable tbody tr:nth-child(even) {
            background: #f1f5ff;
        }

        .ui-datatable tbody tr:hover {
            background: #dbeafe !important;
        }


        .ui-panelgrid {
            background: #f8fbff;
            border-radius: 10px;
            padding: 15px;
        }


        .ui-tabs .ui-tabs-nav {
            background: #1e3a8a;
            border-radius: 8px;
        }

        .ui-tabs .ui-tabs-nav li a {
            color: white !important;
            font-weight: 500;
        }

        .ui-tabs .ui-tabs-nav li.ui-tabs-selected a {
            background: #2563eb !important;
            border-radius: 6px;
        }


        .ui-dialog {
            border-radius: 12px !important;
        }

        .ui-dialog-titlebar {
            background: #1e3a8a !important;
            color: white !important;
            border-radius: 12px 12px 0 0;
        }

        .ui-tabs .ui-tabs-nav {
            background: #1e3a8a !important;
            border-radius: 8px;
            padding: 5px;
        }

        .ui-tabs .ui-tabs-nav li {
            background: transparent !important;
            border: none !important;
            margin-right: 5px;
        }


        .ui-tabs .ui-tabs-nav li a {
            color: #c7d2fe !important;
            font-weight: 500;
        }


        .ui-tabs .ui-tabs-nav li.ui-tabs-selected {
            background: #2563eb !important;
            border-radius: 6px;
        }

        .ui-tabs .ui-tabs-nav li.ui-tabs-selected a {
            color: white !important;
        }


        .ui-tabs .ui-tabs-nav li:hover {
            background: #1d4ed8 !important;
            border-radius: 6px;
        }

        .ui-tabs .ui-tabs-panels {
            border: none !important;
        }

        .btn-logout {
            background: #dc2626 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
        }

        .btn-logout:hover {
            background: #991b1b !important;
        }


        .btn-refresh {
            background: #1d4ed8 !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
        }

        .btn-refresh:hover {
            background: #1e3a8a !important;
        }

        .ui-selectonemenu {
            border-radius: 6px !important;
            border: 1px solid #93c5fd !important;
        }


        .ui-selectonemenu-label {
            color: #1e3a8a !important;
        }


        .ui-selectonemenu-trigger {
            background: #2563eb !important;
            border: none !important;
        }


        .ui-selectonemenu-panel {
            border-radius: 8px !important;
        }


        .ui-selectonemenu-item:hover {
            background: #dbeafe !important;
        }

        .barra-global {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .texto-sesion {
            color: #e0e7ff;
            font-weight: 500;
            font-size: 14px;
        }


    </style>
</h:head>

<h:body>

    <div class="contenedor">

        <h:form id="formInventario">

            <p:growl id="growl" showDetail="true" life="3000"/>
            <div class="barra-global">

                <p:commandButton value="Cerrar sesión"
                                 action="#{loginUI.logout}"
                                 immediate="true"
                                 ajax="false"
                                 styleClass="btn-logout"
                                 icon="pi pi-sign-out"/>

                <h:outputText value="Sesion iniciada: #{loginUI.usuarioLogeado.nombre}"
                              styleClass="texto-sesion"/>

            </div>


            <p:tabView id="tabsPrincipal">

                <p:tab title="Inventario">

                    <div class="barra-superior">


                        <div class="busqueda">

                            <p:inputText id="busqueda"
                                         value="#{InventarioBean.busqueda}"
                                         placeholder="Ingrese su nombre o ID..."/>

                            <p:commandButton value="Buscar"
                                             action="#{InventarioBean.buscarProducto}"
                                             process="@this busqueda"
                                             update="tablaInventario"
                                             styleClass="btn-green"/>

                            <p:commandButton value="Refrescar"
                                             action="#{InventarioBean.refrescar()}"
                                             process="@this"
                                             update="tablaInventario"
                                             styleClass="btn-refresh"/>

                        </div>
                    </div>

                    <p:dataTable id="tablaInventario"
                                 value="#{InventarioBean.listaInventario}"
                                 var="producto"
                                 selection="#{InventarioBean.seleccionado}"
                                 selectionMode="single"
                                 rowKey="#{producto.idProducto}">

                        <p:ajax event="rowSelect" update="formInventario"/>
                        <p:ajax event="rowUnselect" update="formInventario"/>

                        <p:column headerText="ID">#{producto.idProducto}</p:column>
                        <p:column headerText="Nombre">#{producto.nombreProducto}</p:column>

                        <p:column headerText="Stock">
                            <h:outputText value="#{producto.stock} unidades"/>
                        </p:column>

                        <p:column headerText="Entradas">
                            <h:outputText value="#{InventarioBean.obtenerEntradas(producto.idProducto)}"
                                          style="color:green;font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Salidas">
                            <h:outputText value="#{InventarioBean.obtenerSalidas(producto.idProducto)}"
                                          style="color:orange;font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Precio">
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>


                        <p:column headerText="Total Valor">
                            <h:outputText value="#{producto.stock * producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Proveedor">#{producto.proveedor}</p:column>

                    </p:dataTable>

                    <div style="text-align:center; margin-top:15px;">

                        <p:commandButton value="Eliminar"
                                         action="#{InventarioBean.prepararEliminar()}"
                                         process="@this"
                                         update="formInventario growl"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-red"/>

                        <p:commandButton value="Modificar"
                                         action="#{InventarioBean.prepararModificar}"
                                         process="@this"
                                         update="formInventario growl"
                                         oncomplete="PF('dlgModificar').show()"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-green"/>

                    </div>

                    <p:dialog header="Modificar Producto"
                              widgetVar="dlgModificar"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="formModificar">

                            <p:panelGrid columns="2"
                                         rendered="#{not empty InventarioBean.productoEdit}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre del Producto:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.nombreProducto}" required="true"
                                             requiredMessage="No deje el campo del nombre vacio"/>

                                <p:outputLabel value="Precio:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.precio}" required="true"
                                             requiredMessage="No deje el campo del precio vacio"/>

                                <p:outputLabel value="Stock:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.stock}" disabled="true"/>

                                <p:outputLabel value="Proveedor:"/>
                                <p:selectOneMenu id="proveedorDLG"
                                                 value="#{InventarioBean.productoEdit.idProveedor}"
                                                 style="width: 100%;">

                                    <f:selectItem itemLabel="Sin proveedor" itemValue="#{null}"
                                                  noSelectionOption="true"/>

                                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov"
                                                   itemLabel="#{prov.marca} - #{prov.nombre}"
                                                   itemValue="#{prov.id}"/>

                                </p:selectOneMenu>
                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{InventarioBean.modificarProducto}"
                                                 process="formModificar"
                                                 update=":formInventario:tabsPrincipal:tablaInventario :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModificar').hide()"
                                                 styleClass="btn-blue"/>
                            </div>

                        </p:outputPanel>
                    </p:dialog>
                </p:tab>

                <p:tab title="Movimientos">
                    <div class="header-azul">Gestión de Carga y Descarga de Stock</div>

                    <p:dataTable id="tablaMovimientos"
                                 value="#{InventarioBean.listaInventario}"
                                 var="p" rows="10" paginator="true" paginatorPosition="bottom">

                        <p:column headerText="Producto">#{p.nombreProducto}</p:column>

                        <p:column headerText="Stock Actual" style="text-align:center;">
                            <h:outputText value="#{p.stock}" style="font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Cantidad">
                            <p:spinner id="cantOp" value="#{InventarioBean.cantidadOperacion}" min="1"
                                       style="width:100%"/>
                        </p:column>

                        <p:column headerText="Acciones" style="text-align:center;">
                            <p:commandButton value="Entrada" icon="pi pi-plus"
                                             action="#{InventarioBean.registrarEntrada(p,loginUI.usuarioLogeado)}"
                                             process="@this cantOp"
                                             update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario"
                                             styleClass="btn-green" style="margin-right:5px;"/>

                            <p:commandButton value="Salida" icon="pi pi-minus"
                                             action="#{InventarioBean.registrarSalida(p,loginUI.usuarioLogeado)}"
                                             process="@this cantOp"
                                             update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario"
                                             styleClass="btn-red"/>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="Altas">
                    <div style="text-align: center; padding: 30px; background: #f8fbff; border-radius: 8px;">
                        <h:outputText value="Seleccione el registro que desea realizar:"
                                      style="display: block; margin-bottom: 15px; font-size: 15px; font-weight: bold; color: #1e3a8a"/>
                        <p:menuButton value="Opciones de alta" buttonStyleClass="btn-blue" icon="pi pi-list">
                            <p:menuitem value="Registrar producto" icon="pi pi-box"
                                        onclick="PF('dlgProducto').show(); return false;"/>
                            <p:menuitem value="Registrar proveedor" icon="pi pi-truck"
                                        onclick="PF('dlgProveedor').show(); return false;"/>
                            <p:menuitem value="Registrar usuairo" icon="pi pi-user-plus"
                                        onclick="PF('dlgUsuario').show(); return false;"/>
                        </p:menuButton>
                    </div>
                </p:tab>

                <p:tab title="Proveedores">

                    <div class="controls-container barra-superior">

                        <div class="busqueda">
                            <p:inputText id="busquedaProveedor"
                                         value="#{proveedorBean.busqueda}"
                                         placeholder="Ingrese nombre o ID..."/>

                            <p:commandButton value="Buscar"
                                             action="#{proveedorBean.buscarProveedor}"
                                             process="@this busquedaProveedor"
                                             update="tablaProveedores"
                                             styleClass="btn-green"/>

                            <p:commandButton value="Refrescar"
                                             action="#{proveedorBean.cargarProveedores()}"
                                             process="@this cargarProveedores"
                                             update="tablaProveedores"
                                             styleClass="btn-blue"/>
                        </div>
                    </div>

                    <p:dataTable id="tablaProveedores"
                                 value="#{proveedorBean.listaProveedores}"
                                 var="prov"
                                 emptyMessage="No se encontraron proveedores"
                                 style="margin-top:20px;">

                        <p:column headerText="ID Proveedor">
                            <h:outputText value="#{prov.id}"/>
                        </p:column>

                        <p:column headerText="Marca del proveedor">
                            <h:outputText value="#{prov.marca}"/>
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{prov.nombre}"/>
                        </p:column>

                        <p:column headerText="Contacto">
                            <h:outputText value="#{prov.contacto}"/>
                        </p:column>

                        <p:column headerText="Acciones" style="text-align: center;">

                            <p:commandButton value="Modificar"
                                             action="#{proveedorBean.prepararModificacion(prov)}"
                                             process="@this" update=":formInventario:tabsPrincipal:panelModificarProv"
                                             oncomplete="PF('dlgModProv').show()"
                                             styleClass="btn-green"
                                             style="margin-right: 5px;"/>

                            <p:commandButton value="Eliminar"
                                             action="#{proveedorBean.eliminarProveedor(prov)}"
                                             process="@this"
                                             update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl"
                                             styleClass="btn-red">
                                <p:confirm header="Confirmación"
                                           message="¿Estás seguro de que deseas eliminar permanentemente a este proveedor?
                                                    Esta accion es irreversible"
                                           icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                                     responsive="true" width="350">
                        <p:commandButton value="No" type="button"
                                         styleClass="ui-confirmdialog-no ui-button-flat"/>
                        <p:commandButton value="Sí" type="button"
                                         styleClass="ui-confirmdialog-yes"/>
                    </p:confirmDialog>

                    <p:dialog header="Modificar Proveedor"
                              widgetVar="dlgModProv"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="panelModificarProv">

                            <p:panelGrid columns="2"
                                         rendered="#{not empty proveedorBean.proveedorSeleccionado}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre:"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.nombre}" required="true"
                                             requiredMessage="No deje el campo de nombre vacio"/>

                                <p:outputLabel value="Marca del proveedor"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.marca}" required="true"
                                             requiredMessage="No deje espacios vacios"/>
                                <p:outputLabel value="Contacto:"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.contacto}" required="true"
                                             requiredMessage="No deje el campo del numero telefonico vacio"/>

                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{proveedorBean.guardarModificacion}"
                                                 process="panelModificarProv"
                                                 update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModProv').hide()"
                                                 styleClass="btn-blue"/>
                            </div>

                        </p:outputPanel>
                    </p:dialog>

                </p:tab>

                <p:tab title="Usuarios">

                    <div id="zonaBusqueda"
                         style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; justify-content: center;">

                        <p:commandButton value="Refrescar"
                                         action="#{usuarioBean.cargarUsuarios}"
                                         process="@this"
                                         update=":formInventario:tabsPrincipal:tablaUsuarios txtBusqueda"
                                         styleClass="btn-blue"/>

                        <p:inputText id="txtBusqueda"
                                     value="#{usuarioBean.busqueda}"
                                     placeholder="Ingresa el nombre o el id"
                                     style="width: 300px;"/>

                        <p:commandButton value="Buscar"
                                         action="#{usuarioBean.buscarUsuario}"
                                         process="txtBusqueda @this"
                                         update=":formInventario:tabsPrincipal:tablaUsuarios"
                                         styleClass="btn-blue"/>
                    </div>

                    <p:dataTable id="tablaUsuarios"
                                 value="#{usuarioBean.listaUsuarios}"
                                 var="user"
                                 emptyMessage="No se encontraron usuarios"
                                 style="margin-top:20px;">

                        <p:column headerText="ID Usuario">
                            <h:outputText value="#{user.id}"/>
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{user.nombre}"/>
                        </p:column>

                        <p:column headerText="Contraseña">
                            <h:outputText value="*********"/>
                        </p:column>

                        <p:column headerText="Rol de usuario">
                            <h:outputText value="#{user.rol}"/>
                        </p:column>

                        <p:column headerText="Acciones" style="text-align: center;">
                            <p:commandButton value="Modificar"
                                             action="#{usuarioBean.prepararModificacion(user)}"
                                             process="@this"
                                             update=":formInventario:tabsPrincipal:panelModificarUser"
                                             oncomplete="PF('dlgModUser').show()"
                                             styleClass="btn-green"
                                             style="margin-right: 5px;"/>

                            <p:commandButton value="Eliminar"
                                             action="#{usuarioBean.eliminarUsuario(user)}"
                                             process="@this"
                                             update=":formInventario:tabsPrincipal:tablaUsuarios :formInventario:growl"
                                             styleClass="btn-red">
                                <p:confirm header="Confirmación"
                                           message="¿Estás seguro de que deseas eliminar permanentemente a este usuario?
                                                    Esta accion es irreversible"
                                           icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                                     responsive="true" width="350">
                        <p:commandButton value="No" type="button"
                                         styleClass="ui-confirmdialog-no ui-button-flat"/>
                        <p:commandButton value="Sí" type="button"
                                         styleClass="ui-confirmdialog-yes"/>
                    </p:confirmDialog>

                    <p:dialog header="Modificar Usuario"
                              widgetVar="dlgModUser"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="panelModificarUser">
                            <p:panelGrid columns="2"
                                         rendered="#{not empty usuarioBean.usuarioSeleccionado}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre:"/>
                                <p:inputText value="#{usuarioBean.usuarioSeleccionado.nombre}" required="true"
                                             requiredMessage="No deje el campo de nombre vacío"/>

                                <p:outputLabel value="Contraseña:"/>
                                <p:inputText value="#{usuarioBean.usuarioSeleccionado.password}" required="true"
                                             requiredMessage="No deje la contraseña vacía"/>

                                <p:outputLabel value="Rol:"/>
                                <p:selectOneMenu value="#{usuarioBean.usuarioSeleccionado.rol}">
                                    <f:selectItems value="#{usuarioBean.roles}"/>
                                </p:selectOneMenu>

                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{usuarioBean.guardarModificacion}"
                                                 process="panelModificarUser"
                                                 update=":formInventario:tabsPrincipal:tablaUsuarios :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModUser').hide()"
                                                 styleClass="btn-blue"/>
                            </div>
                        </p:outputPanel>
                    </p:dialog>

                </p:tab>


                <p:tab title="Historial de movimientos"
                       rendered="#{AuditoriaBean.puedeVerAuditoria(loginUI.usuarioLogeado)}">


                    <div class="header-azul"
                         style="background: #3b82f6; color: white; padding: 10px; margin-bottom: 10px; border-radius: 5px;">
                        Historial de Movimientos y Reporte Mensual
                    </div>

                    <p:outputPanel id="cajaFiltros" layout="block" style="display: flex; flex-direction: row; justify-content: flex-start; align-items: flex-end; gap: 20px; background: #f8fbff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0; width: 100%;">

                        <h:panelGroup layout="block">
                            <h:outputText value="Filtrar por Usuario:" style="font-weight:bold; color:#1e3a8a; display:block; margin-bottom:5px;"/>
                            <p:selectOneMenu id="usuarioFiltro" value="#{AuditoriaBean.idUsuarioFiltro}" style="min-width: 180px;">
                                <f:selectItem itemLabel="Todos los usuarios" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{AuditoriaBean.listaUsuarios}" var="usr" itemLabel="#{usr.nombre}" itemValue="#{usr.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup layout="block">
                            <h:outputText value="Desde:" style="font-weight:bold; color:#1e3a8a; display:block; margin-bottom:5px;"/>
                            <p:datePicker id="fechaDesde" value="#{AuditoriaBean.fechaInicio}" pattern="dd/MM/yyyy" showIcon="true" placeholder="Fecha inicio" />
                        </h:panelGroup>

                        <h:panelGroup layout="block">
                            <h:outputText value="Hasta:" style="font-weight:bold; color:#1e3a8a; display:block; margin-bottom:5px;"/>
                            <p:datePicker id="fechaHasta" value="#{AuditoriaBean.fechaFin}" pattern="dd/MM/yyyy" showIcon="true" placeholder="Fecha fin" />
                        </h:panelGroup>

                        <h:panelGroup layout="block" style="display: flex; gap: 10px;">

                            <p:commandButton value="Filtrar"
                                             action="#{AuditoriaBean.aplicarFiltros}"
                                             process="@this usuarioFiltro fechaDesde fechaHasta"
                                             update="areaResultados msgFiltros"
                                             styleClass="btn-green"
                                             icon="pi pi-filter" />

                            <p:commandButton value="Limpiar Filtros"
                                             action="#{AuditoriaBean.limpiarFiltros}"
                                             process="@this"
                                             update=":formInventario:tabsPrincipal:cajaFiltros :formInventario:tabsPrincipal:areaResultados"
                                             styleClass="btn-blue"
                                             icon="pi pi-filter-slash" />
                        </h:panelGroup>

                    </p:outputPanel>

                    <h:panelGroup id="areaResultados" layout="block">

                        <h:panelGrid columns="3" id="panelTotales"
                                     style="margin-bottom:15px; background:#f8fafc; padding:15px; border: 1px solid #e2e8f0; border-radius:8px; width:100%;">
                            <h:panelGroup>
                                <h:outputText value="TOTAL ENTRADAS: "
                                              style="font-weight:bold; color:#64748b; display:block;"/>
                                <h:outputText value="#{AuditoriaBean.totalEntradas} unidades"
                                              style="color:#22c55e; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <h:outputText value="TOTAL SALIDAS: "
                                              style="font-weight:bold; color:#64748b; display:block;"/>
                                <h:outputText value="#{AuditoriaBean.totalSalidas} unidades"
                                              style="color:#f59e0b; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>

                            <p:commandButton value="Actualizar Reporte"
                                             action="#{AuditoriaBean.cargarTodosLosMovimientos()}"
                                             process="@this"
                                             update="areaResultados"
                                             icon="pi pi-refresh"
                                             styleClass="btn-blue"/>
                        </h:panelGrid>

                        <p:dataTable id="tablaAuditoria"
                                     value="#{AuditoriaBean.listaFiltrada}"
                                     var="mov"
                                     emptyMessage="No hay movimientos registrados"
                                     rows="10"
                                     paginator="true"
                                     paginatorPosition="bottom"
                                     allowUnsorting="true"
                                     sortMode="single"
                                     style="margin-top:10px;">

                            <p:column headerText="Fecha" style="width:150px; text-align:center;" sortBy="#{mov.fecha}" sortOrder="descending">
                                <h:outputText value="#{mov.fecha}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Tijuana"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Usuario" style="text-align:center;" sortBy="#{mov.usuario.nombre}">
                                <h:outputText value="#{mov.usuario != null ? mov.usuario.nombre : 'Sistema'}"/>
                            </p:column>

                            <p:column headerText="Producto" sortBy="#{mov.producto.nombre}">
                                <h:outputText value="#{mov.producto != null ? mov.producto.nombre : 'N/A'}"/>
                            </p:column>

                            <p:column headerText="Tipo" style="text-align:center;" sortBy="#{mov.tipo}">
                                <h:outputText value="#{mov.tipo}"
                                              style="font-weight:bold; text-transform: uppercase; color: #{mov.tipo == 'entrada' ? '#22c55e' : '#f59e0b'}"/>
                            </p:column>

                            <p:column headerText="Cantidad" style="text-align:center;" sortBy="#{mov.cantidad}">
                                <h:outputText value="#{mov.cantidad}"/>
                            </p:column>

                        </p:dataTable>
                    </h:panelGroup>
                </p:tab>

            </p:tabView>

        </h:form>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350"
                         appendTo="@(body)">
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
            <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
        </p:confirmDialog>

    </div>
    <p:confirmDialog widgetVar="confirmDialog" appendTo="@(body)">

        <h:outputText value="Quieres eliminar este producto?
                             Esta accion es irreversible"
                      title="Confirmacion"/>

        <p:commandButton value="Sí"
                         action="#{InventarioBean.eliminarProducto}"
                         process="@this"
                         update=":formInventario:tablaInventario :formInventario:growl"
                         oncomplete="PF('confirmDialog').hide()"/>

        <p:commandButton value="No"
                         type="button"
                         onclick="PF('confirmDialog').hide();"/>

    </p:confirmDialog>
    <p:dialog header="Registro de productos" widgetVar="dlgProducto" modal="true" showEffect="fade" hideEffect="fade"
              resizable="false" onHide="document.getElementById('formAltaProducto').reset();">
        <p:ajax event="close" resetValues="true" update="formAltaProducto"/>
        <h:form id="formAltaProducto">
            <p:growl id="msgsProd" showSummary="true"/>
            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                <p:outputLabel for="nombre" value="Nombre *"/>
                <p:inputText id="nombre" value="#{productoBean.producto.nombre}" required="true"
                             requiredMessage="Ingrese un nombre"/>
                <p:outputLabel for="precio" value="Precio *"/>
                <p:inputText id="precio" value="#{productoBean.producto.precio}" required="true"
                             requiredMessage="Asegurese de ingresar un precio"/>

                <p:outputLabel for="proveedor" value="Proveedor *"/>
                <p:selectOneMenu id="proveedor" value="#{productoBean.idProveedorSeleccionado}" required="true"
                                 requiredMessage="Seleccione un proveedor">
                    <f:selectItem itemLabel="Seleccionar" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov"
                                   itemLabel="#{prov.marca} - #{prov.nombre}" itemValue="#{prov.id}"/>
                </p:selectOneMenu>
                <p:outputLabel for="stock" value="Stock *"/>
                <p:inputText id="stock" value="#{productoBean.stockInicial}" required="true"
                             requiredMessage="No deje el Stock vacio"/>

                <p:commandButton value="Registrar" action="#{productoBean.registrar(loginUI.usuarioLogeado)}"
                                 process="@form" update="msgsProd :formInventario:tabsPrincipal:tablaInventario @form"
                                 styleClass="btn-green"
                                 oncomplete="if (!args.validationFailed) PF('dlgProducto').hide();"
                                 style="margin-top: 10px;"/>
            </p:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Registro de Proveedor" widgetVar="dlgProveedor" modal="true" showEffect="fade" hideEffect="fade"
              resizable="false" onHide="document.getElementById('formAltaProveedor').reset();">
        <p:ajax event="close" resetValues="true" update="formAltaProveedor"/>
        <h:form id="formAltaProveedor">
            <p:growl id="msgsProv" showDetail="true"/>
            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                <p:outputLabel value="Marca del proveedor * "/>
                <p:inputText id="marcaProv" value="#{proveedorBean.proveedor.marca}"/>

                <p:outputLabel value="Nombre del proveedor *"/>
                <p:inputText id="nombreProv" value="#{proveedorBean.proveedor.nombre}" required="true"
                             requiredMessage="Asegurese de ingresar un nombre"/>

                <p:outputLabel value="Numero del proveedor *"/>
                <p:inputText id="telefonoProv" value="#{proveedorBean.proveedor.contacto}" required="true"
                             requiredMessage="Asegurese de ingresar un numero de celular"/>

                <p:commandButton value="Registrar" action="#{proveedorBean.registrar}"
                                 process="@form" update="msgsProv :formInventario:tabsPrincipal:tablaProveedores @form"
                                 styleClass="btn-green"
                                 oncomplete="if (!args.validationFailed) PF('dlgProveedor').hide();"
                                 style="margin-top: 10px;"/>
            </p:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Registro de Usuario" widgetVar="dlgUsuario" modal="true" showEffect="fade" hideEffect="fade"
              resizable="false" onHide="document.getElementById('formAltaUsuario').reset();">
        <p:ajax event="close" resetValues="true" update="formAltaUsuario"/>
        <h:form id="formAltaUsuario">
            <p:growl id="msgsUsu" showDetail="true"/>
            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                <p:outputLabel value="Nombre de usuario *"/>
                <p:inputText id="nombreUsuario" value="#{usuarioBean.usuario.nombre}" required="true"
                             requiredMessage="Asegurese de ingresar un nombre"/>

                <p:outputLabel value="Constraseña *"/>
                <p:password id="passwordUsuario" value="#{usuarioBean.usuario.password}" required="true"
                            requiredMessage="Asegurese de ingresar una contraseña"/>

                <p:outputLabel value="Rol del usuario"/>
                <p:selectOneMenu id="rolUsuario" value="#{usuarioBean.usuario.rol}" required="true"
                                 requiredMessage="Seleccione un rol">
                    <f:selectItem itemLabel="Seleccionar" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{usuarioBean.roles}" var="rol" itemLabel="#{rol}" itemValue="#{rol}"/>
                </p:selectOneMenu>

                <p:commandButton value="Registrar" action="#{usuarioBean.registrar}"
                                 process="@form" update="msgsUsu :formInventario:tabsPrincipal:tablaUsuarios @form"
                                 styleClass="btn-green"
                                 oncomplete="if (!args.validationFailed) PF('dlgUsuario').hide();"
                                 style="margin-top: 10px;"/>
            </p:panelGrid>
        </h:form>
    </p:dialog>


</h:body>
</html>
