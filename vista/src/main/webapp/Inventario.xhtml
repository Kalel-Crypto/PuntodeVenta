<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Inventario</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .busqueda {
            flex-grow: 1;
            text-align: center;
        }

        .btn-blue {
            background: #3b82f6 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-red {
            background: #f87171 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }

        .btn-green {
            background: #4ade80 !important;
            color: white !important;
            font-weight: bold !important;
            border: none !important;
            padding: 8px 15px;
        }
    </style>
</h:head>

<h:body>

    <div class="contenedor">

        <h:form id="formInventario">

            <p:growl id="growl" showDetail="true" life="3000"/>

            <p:tabView id="tabsPrincipal">

                <!-- tab de invetairo -->
                <p:tab title="Inventario">

                    <div class="barra-superior">

                        <p:commandButton value="Regresar"
                                         styleClass="btn-blue"
                                         action="#"/>

                        <div class="busqueda">

                            <p:inputText id="busqueda"
                                         value="#{InventarioBean.busqueda}"
                                         placeholder="ingrese su nombre o ID..." />

                            <p:commandButton value="Buscar"
                                             action="#{InventarioBean.buscarProducto}"
                                             process="@this busqueda"
                                             update="tablaInventario"
                                             styleClass="btn-green"/>

                            <p:commandButton value="Refrescar"
                                             action="#{InventarioBean.refrescar()}"
                                             process="@this"
                                             update="tablaInventario"/>

                        </div>
                    </div>

                    <p:dataTable id="tablaInventario"
                                 value="#{InventarioBean.listaInventario}"
                                 var="producto"
                                 selection="#{InventarioBean.seleccionado}"
                                 selectionMode="single"
                                 rowKey="#{producto.idProducto}">

                        <p:ajax event="rowSelect" update="formInventario"/>
                        <p:ajax event="rowUnselect" update="formInventario"/>

                        <p:column headerText="ID">#{producto.idProducto}</p:column>
                        <p:column headerText="Nombre">#{producto.nombreProducto}</p:column>

                        <p:column headerText="Stock">
                            <h:outputText value="#{producto.stock} unidades"/>
                        </p:column>

                        <p:column headerText="Precio">
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Proveedor">#{producto.proveedor}</p:column>

                    </p:dataTable>

                    <div style="text-align:center; margin-top:15px;">

                        <p:commandButton value="Eliminar"
                                         action="#{InventarioBean.prepararEliminar}"
                                         process="@this"
                                         update="formInventario growl"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-red"/>

                        <p:commandButton value="Modificar"
                                         action="#{InventarioBean.prepararModificar}"
                                         process="@this"
                                         update="formInventario growl"
                                         oncomplete="PF('dlgModificar').show()"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="btn-green"/>

                    </div>

                </p:tab>

                <!-- tab de las altas de producto -->
                <p:tab title="Altas">

                    <p:tabView>

                        <!-- alta de producto -->
                        <p:tab title="Registrar Producto">

                            <p:growl id="msgs" showDetail="true"/>

                            <div class="header-azul">Registro de productos</div>

                            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder panel-contenedor">

                                <p:outputLabel for="nombre" value="Nombre *"/>
                                <p:inputText id="nombre" value="#{productoBean.producto.nombre}" required="true"/>

                                <p:outputLabel for="precio" value="Precio *"/>
                                <p:inputText id="precio" value="#{productoBean.producto.precio}" required="true"/>

                                <p:outputLabel for="proveedor" value="Proveedor *"/>
                                <p:selectOneMenu id="proveedor" value="#{productoBean.idProveedorSeleccionado}" required="true">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov"
                                                   itemLabel="#{prov.nombre}" itemValue="#{prov.id}"/>
                                </p:selectOneMenu>

                                <p:outputLabel for="stock" value="Stock *"/>
                                <p:inputText id="stock" value="#{productoBean.stockInicial}" required="true"/>

                                <h:panelGrid columns="2" style="margin-top:20px;">
                                    <p:commandButton value="Cancelar" process="@this"/>

                                    <p:commandButton value="Registrar"
                                                     action="#{productoBean.registrar}"
                                                     process="@this nombre precio proveedor stock"
                                                     update="msgs"
                                                     styleClass="btn-green"/>
                                </h:panelGrid>

                            </p:panelGrid>

                        </p:tab>

                        <!-- alta de proveedor-->
                        <p:tab title="Registrar Proveedor">

                            <p:growl id="msgsProveedor"/>

                            <p:panelGrid columns="1">

                                <p:inputText id="nombreProv" value="#{proveedorBean.proveedor.nombre}" required="true"/>
                                <p:inputText id="telefonoProv" value="#{proveedorBean.proveedor.contacto}" required="true"/>

                                <p:commandButton value="Registrar"
                                                 action="#{proveedorBean.registrar}"
                                                 process="@this nombreProv telefonoProv"
                                                 update="msgsProveedor"/>

                            </p:panelGrid>

                        </p:tab>

                        <!-- alta de usuario -->
                        <p:tab title="Registrar Usuario">

                            <p:growl id="msgsUsuario"/>

                            <p:panelGrid columns="1">

                                <p:inputText id="nombreUsuario" value="#{usuarioBean.usuario.nombre}" required="true"/>
                                <p:password id="passwordUsuario" value="#{usuarioBean.usuario.password}" required="true"/>

                                <p:selectOneMenu id="rolUsuario" value="#{usuarioBean.usuario.rol}" required="true">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{usuarioBean.roles}" var="rol"
                                                   itemLabel="#{rol}" itemValue="#{rol}"/>
                                </p:selectOneMenu>

                                <p:commandButton value="Registrar"
                                                 action="#{usuarioBean.registrar}"
                                                 process="@this nombreUsuario passwordUsuario rolUsuario"
                                                 update="msgsUsuario"/>

                            </p:panelGrid>

                        </p:tab>

                    </p:tabView>

                </p:tab>
                <!--Panl de mostrarproveedores -->

                <p:tab title="Proveedores">

                    <div class="controls-container barra-superior">
                        <p:commandButton value="Regresar" action="inventario.xhtml" styleClass="btn-blue" />

                        <div class="busqueda">
                            <p:inputText id="busquedaProveedor"
                                         value="#{proveedorBean.busqueda}"
                                         placeholder="ingrese nombre o ID..." />

                            <p:commandButton value="Buscar"
                                             actionListener="#{proveedorBean.buscarProveedor}"
                                             update="tablaProveedores"
                                             styleClass="btn-green" />

                            <p:commandButton value="Refrescar"
                                             actionListener="#{proveedorBean.cargarProveedores}"
                                             update="tablaProveedores"
                                             styleClass="btn-blue" />
                        </div>
                    </div>

                    <p:dataTable id="tablaProveedores"
                                 value="#{proveedorBean.listaProveedores}"
                                 var="prov"
                                 emptyMessage="No se encontraron proveedores"
                                 style="margin-top:20px;">

                        <p:column headerText="ID Proveedor">
                            <h:outputText value="#{prov.id}" />
                        </p:column>

                        <p:column headerText="Nombre">
                            <h:outputText value="#{prov.nombre}" />
                        </p:column>

                        <p:column headerText="Contacto">
                            <h:outputText value="#{prov.contacto}" />
                        </p:column>

                        <p:column headerText="Acciones" style="text-align: center;">

                            <p:commandButton value="Modificar"
                                             action="#{proveedorBean.prepararModificacion(prov)}"
                                             process="@this"  update=":formInventario:tabsPrincipal:panelModificarProv"
                                             oncomplete="PF('dlgModProv').show()"
                                             styleClass="btn-green"
                                             style="margin-right: 5px;" />

                            <p:commandButton value="Eliminar"
                                             actionListener="#{proveedorBean.eliminarProveedor(prov)}"
                                             update="tablaProveedores growl"
                                             styleClass="btn-red">
                                <p:confirm header="Confirmación"
                                           message="¿Estás seguro de que deseas eliminar permanentemente a este proveedor?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>

                        </p:column>
                    </p:dataTable>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                                     responsive="true" width="350">
                        <p:commandButton value="No" type="button"
                                         styleClass="ui-confirmdialog-no ui-button-flat"/>
                        <p:commandButton value="Sí" type="button"
                                         styleClass="ui-confirmdialog-yes" />
                    </p:confirmDialog>

                    <p:dialog header="Modificar Proveedor"
                              widgetVar="dlgModProv"
                              modal="true"
                              showEffect="fade"
                              hideEffect="fade"
                              resizable="false">

                        <p:outputPanel id="panelModificarProv">

                            <p:panelGrid columns="2"
                                         rendered="#{not empty proveedorBean.proveedorSeleccionado}"
                                         styleClass="ui-noborder">

                                <p:outputLabel value="Nombre:" />
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.nombre}" required="true" />

                                <p:outputLabel value="Contacto:" />
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.contacto}" required="true" />

                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios"
                                                 action="#{proveedorBean.guardarModificacion}"
                                                 process="panelModificarProv"
                                                 update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl"
                                                 oncomplete="if (!args.validationFailed) PF('dlgModProv').hide()"
                                                 styleClass="btn-blue" />
                            </div>

                        </p:outputPanel>
                    </p:dialog>

                </p:tab>


                <!--Panl de la auditoria -->

                <p:tab title="Auditoría">

                    <div class="header-azul">Vista de Auditoría</div>

                    <div class="barra-superior">
                        <p:selectOneMenu>
                            <f:selectItem itemLabel="Todos"/>
                            <f:selectItem itemLabel="Entrada"/>
                            <f:selectItem itemLabel="Salida"/>
                        </p:selectOneMenu>

                        <p:selectOneMenu id="usuarioFiltro"
                                         value="Usuarios.."
                                         style="width: 180px; margin-left:10px;">
                            <f:selectItem itemLabel="Todos los usuarios" itemValue="#{null}" />
                            <f:selectItems value="#{usuarioBean.listaUsuarios}"
                                           var="user"
                                           itemLabel="#{user.nombre}"
                                           itemValue="#{user.id}" />
                        </p:selectOneMenu>

                        <p:inputText placeholder="Buscar..."/>
                    </div>

                    <p:panel style="background:black; color:lime; height:300px; overflow:auto;">
                        Aqui va la auditoria
                    </p:panel>

                </p:tab>


            </p:tabView>
        </h:form>

    </div>

</h:body>
</html>
