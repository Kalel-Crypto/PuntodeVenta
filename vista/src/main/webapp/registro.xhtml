<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Registro de Usuarios</title>
    <style type="text/css">
        .header-azul {
            background-color: #5d6dff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
        }
        .panel-contenedor {
            border: none !important;
            background-color: white !important;
            padding: 20px;
        }
        .btn-cancelar {
            background-color: #ff6b6b !important;
            border: none !important;
            border-radius: 10px !important;
            width: 120px;
            height: 45px;
            color: white !important;
        }
        .btn-registrar {
            background-color: #82e0aa !important;
            border: none !important;
            border-radius: 10px !important;
            width: 120px;
            height: 45px;
            color: #000 !important;
        }
        .input-style {
            background-color: #e0e0e0 !important;
            border-radius: 15px !important;
            border: none !important;
            width: 100%;
            height: 30px;
        }
    </style>
</h:head>
<h:body>
    <p:dialog visible="true" closable="false" modal="true" showHeader="false" resizable="false">
        <h:form id="formUsuario">
            <p:growl id="msgs" showDetail="true" />
            <div class="header-azul">Registro de usuarios</div>
            <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder panel-contenedor">

                <p:outputLabel for="nombre" value="Nombre *" style="font-weight: bold;"/>
                <p:inputText id="nombre" value="#{usuarioBean.usuario.nombre}"
                             required="true" styleClass="input-style"/>

                <p:outputLabel for="rol" value="Rol *" style="font-weight: bold;"/>
                <p:selectOneMenu id="rol" value="#{usuarioBean.usuario.rol}" required="true" style="width: 100%;">
                    <f:selectItem itemLabel="Seleccione un rol" itemValue="" noSelectionOption="true" />
                    <f:selectItem itemLabel="ADMINISTRADOR" itemValue="ADMINISTRADOR" />
                    <f:selectItem itemLabel="CAJERO" itemValue="CAJERO" />
                </p:selectOneMenu>

                <p:outputLabel for="password" value="Contraseña *" style="font-weight: bold;"/>
                <p:password id="password" value="#{usuarioBean.usuario.password}"
                            required="true" styleClass="input-style"/>

                <h:panelGrid columns="2" style="width: 100%; margin-top: 20px;">
                    <p:commandButton value="Cancelar" styleClass="btn-cancelar" process="@this" />
                    <p:commandButton value="Registrar" action="#{usuarioBean.registrar}"
                                     styleClass="btn-registrar" update="formUsuario, msgs" />
                </h:panelGrid>
            </p:panelGrid>

            <h:panelGroup rendered="#{usuarioBean.exito}">
                <div style="background-color: #2ecc71; color: black; padding: 10px; text-align: center; font-weight: bold; margin: 10px; border-radius: 5px;">
                    Usuario registrado correctamente ✓
                </div>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</h:body>
</html>
