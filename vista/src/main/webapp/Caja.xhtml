<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Refresqueria EVA</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .barra-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .titulo {
            font-size: 20px;
            font-weight: bold;
        }

        .info {
            color: #e0e7ff;
            font-size: 14px;
        }

        .contenedor {
            display: flex;
            gap: 20px;
        }

        .panel-izq {
            flex: 3;
        }

        .panel-der {
            flex: 1;
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 12px;
        }

        .btn {
            background: #2563eb !important;
            color: white !important;
            border-radius: 8px !important;
        }

        .btn:hover {
            background: #1e40af !important;
        }

        .btn-danger {
            background: #ef4444 !important;
        }

        .btn-danger:hover {
            background: #b91c1c !important;
        }

        .ui-datatable thead th {
            background: #1e3a8a !important;
            color: white !important;
        }

        .ui-datatable tbody tr:hover {
            background: rgba(59,130,246,0.3) !important;
        }

        .total {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .btn-delete-row {
            background: #ef4444 !important;
            color: white !important;
            border-radius: 6px !important;
        }

        .barra-busqueda {
            margin-bottom: 15px;
            width: 100%;
        }


        .ui-autocomplete {
            width: 100%;
        }
        .ui-autocomplete-input {
            width: 100% !important;
            border-radius: 8px !important;
            padding: 10px !important;
        }
    </style>
</h:head>

<h:body>

    <h:form id="formVenta">

        <p:growl id="mensajes" showDetail="true" life="3000" />

        <div class="barra-top">
            <span class="titulo">Punto de Venta</span>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="display: flex; gap: 10px;">
                    <p:commandButton value="Corte de caja" styleClass="btn-danger" action="#{ventaBean.validarCorteCaja()}" onclick="PF('dlgCorte').show();"/>
                    <p:commandButton value="Cancelar Venta" styleClass="btn-danger" onclick="PF('dlgConf').show();" type="button" update="@form"/>
                </div>
                <div style="text-align: right; border-left: 2px solid rgba(255,255,255,0.2); padding-left: 15px;">
                    <h:outputText value="Caja: #{ventaBean.cajaActual.idcaja}" class="info"/>
                    <br/>
                    <h:outputText value="Cajero: #{ventaBean.usuario.nombre}" class="info"/>
                </div>
            </div>
        </div>

        <div class="contenedor">

            <div class="panel-izq">

                <div class="barra-busqueda">
                    <p:autoComplete id="buscadorProducto"
                                    value="#{ventaBean.idProductoSeleccionado}"
                                    completeMethod="#{ventaBean.sugerirProductos}"
                                    var="prod"
                                    itemLabel="#{prod.nombreProducto}"
                                    itemValue="#{prod.idProducto}"
                                    forceSelection="true"
                                    minQueryLength="1"
                                    placeholder="Busca por Nombre o ID (Ej. Gall...)"
                                    emptyMessage="Producto no encontrado"
                                    scrollHeight="250">

                        <p:ajax event="itemSelect" listener="#{ventaBean.agregarProducto}" update="@form" />

                        <p:column>
                            <h:outputText value="#{prod.nombreProducto}" />
                        </p:column>

                        <p:column>
                            <h:outputText value="$#{prod.precio}" />
                        </p:column>

                        <p:column>
                            <h:outputText value="#{prod.stock > 0 ? 'Stock: ' : '¡AGOTADO!'}"
                                          style="font-weight: bold; color: #{prod.stock > 0 ? '#22c55e' : '#ef4444'};" />
                            <h:outputText value="#{prod.stock}" rendered="#{prod.stock > 0}" style="font-weight: bold; color: #22c55e;"/>
                        </p:column>

                    </p:autoComplete>
                </div>

                <p:dataTable value="#{ventaBean.listaDetalle}" var="item" id="tablaDetalle" emptyMessage="No hay articulos agregados">

                    <p:column headerText="Producto">
                        #{item.producto.nombre}
                    </p:column>

                    <p:column headerText="Precio">
                        <h:outputText value="#{item.precioUnitario}">
                            <f:convertNumber type="currency"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Cantidad" style="width: 120px; text-align: center">
                        <p:spinner value="#{item.cantidad}" min="1" style="width: 80px">
                            <p:ajax process="@this" update="@form" listener="#{ventaBean.recalcularTotal}"/>
                        </p:spinner>
                    </p:column>

                    <p:column headerText="Subtotal">
                        <h:outputText value="#{item.precioUnitario * item.cantidad}">
                            <f:convertNumber type="currency"/>
                        </h:outputText>
                    </p:column>

                    <p:column style="width:60px; text-align:center;">
                        <p:commandButton icon="pi pi-trash"
                                         action="#{ventaBean.eliminar(item)}"
                                         update="@form"
                                         styleClass="btn-delete-row ui-button-rounded ui-button-sm"/>
                    </p:column>

                </p:dataTable>

            </div>

            <div class="panel-der">

                <h3>Resumen</h3>

                <p>Total:</p>
                <div class="total">
                    <h:outputText value="#{ventaBean.total}">
                        <f:convertNumber type="currency"/>
                    </h:outputText>
                </div>

                <br/>

                <p>Dinero recibido</p>

                <p:inputNumber value="#{ventaBean.dineroRecibido}"
                               decimalPlaces="2"
                               style="width:100%;">

                    <p:ajax event="keyup"
                            listener="#{ventaBean.calcularCambio}"
                            update="cambioBox"/>

                </p:inputNumber>

                <br/><br/>

                <p>Cambio</p>

                <h:panelGroup id="cambioBox" layout="block" styleClass="box">

                    <h:outputText value="#{ventaBean.cambio}">
                        <f:convertNumber type="currency"/>
                    </h:outputText>

                </h:panelGroup>

                <br/>
                <p:commandButton value="Cobrar"
                                 action="#{ventaBean.cobrar}"
                                 update="@form"
                                 styleClass="btn"
                                 style="width:100%;"/>

            </div>

        </div>
        <p:dialog
                header="Validación Administrativa"
                widgetVar="dlgCorte"
                modal="true"
                closable="false"
                resizable="false"
                width="400"
                closeOnEscape="true">
            <h:panelGrid columns="1" style="width:100%; gap:10px;">
                <p:outputLabel value="Nombre del administrador"/>
                <p:inputText
                        value="#{ventaBean.adminNombre}"
                        style="width:100%;" />
                <p:outputLabel value="Contraseña"/>
                <p:password
                        value="#{ventaBean.adminPassword}"
                        feedback="false"
                        style="width:100%;" />
               <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                   <p:commandButton
                       value="Cancelar"
                       type="button"
                       onclick="PF('dlgCorte').hide();"
                       styleClass="btn-danger"/>
                   <p:commandButton
                           value="Aceptar"
                           action="#{ventaBean.validarCorteCaja}"
                           update="@form mensajes"
                           ajax="false"
                           styleClass="btn"/>
               </div>
                <h:outputText
                        value="Una vez aceptado se cerrará la sesión actual y se redireccionará al inicio de sesión."
                        style="font-size:12px; color:#cbd5e1;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog
        header="Confirmacion de operacion"
        widgetVar="dlgConf"
        modal="true"
        closable="false"
        minimizable="false"
        closeOnEscape="true"
        width="300">
            <h:panelGrid columns="1" style="width:100%; gap:10px;">
            <p:outputLabel value="¿Desea cancelar la operacion?"/>
                <div style="display: flex; justify-content: center; gap:10px;margin-top: 10px;">
                    <p:commandButton
                            value="Regresar"
                            type="button"
                            onclick="PF('dlgConf').hide();"
                            styleClass="btn"/>
                    <p:commandButton
                            value="Aceptar"
                            action="#{ventaBean.cancelarVenta()}"
                            update="@form mensajes"
                            ajax="false"
                            styleClass="btn"/>
                </div>


            </h:panelGrid>
        </p:dialog>
    </h:form>

</h:body>
</html>
